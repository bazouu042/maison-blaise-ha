[project]
name = "maison-blaise-ha"
version = "0.1.0"
description = "Workflow Mistral géré — le chat pilote Home Assistant (Maison Blaise) via tunnel Cloudflare"
requires-python = ">=3.12"
dependencies = [
    "mistralai-workflows>=3.10",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
